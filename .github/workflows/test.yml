name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: install.sh placeholder resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install tests
        run: bash tests/test-install.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning \
            install.sh \
            install-packages.sh \
            auto-install.sh \
            tests/test-install.sh

      - name: Lint POSIX sh memory tools
        run: shellcheck --shell=sh --severity=warning ai-memory/tools/*.sh

  memory:
    name: ai-memory validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate memory index
        run: |
          sh ai-memory/tools/Update-MemoryIndex.sh
          sh ai-memory/tools/Test-Memory.sh

      - name: Ensure personal notes are not committed
        run: |
          # Only .gitkeep and README.md belong in the tracked memory folders.
          tracked=$(git ls-files \
            'ai-memory/user/*' 'ai-memory/environments/*' 'ai-memory/prefs/*' \
            'ai-memory/projects/*' 'ai-memory/reference/*' 'ai-memory/trivia/*' \
            'ai-memory/paths/*' 'ai-memory/scratch/*' \
            | grep -v -E '/(\.gitkeep|README\.md)$' || true)
          if [ -n "$tracked" ]; then
            echo "Personal memory notes must stay untracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          echo "No personal notes are tracked."

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pi config for literal credentials
        run: |
          python3 -c "import json; json.load(open('.config/pi/settings.json'))"
          python3 -c "import json; json.load(open('.config/pi/models.json'))"

          # API keys must be env var references, never literals.
          if grep -nE '"apiKey": *"(sk-|gsk_|pi-|[A-Za-z0-9]{32})' .config/pi/models.json; then
            echo "Literal API key found in models.json." >&2
            exit 1
          fi
          echo "pi config references credentials by env var only."

      - name: Check for tracked credential files
        run: |
          found=$(git ls-files | grep -E '(^|/)(\.env|auth\.json|trust\.json|models-store\.json)$' || true)
          if [ -n "$found" ]; then
            echo "Credential files must not be tracked:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "No credential files are tracked."
